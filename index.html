<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duo">
<meta name="description" content="Countdown to iPhone Duo — January 25, 2027">
<meta property="og:title" content="iPhone Duo countdown">
<meta property="og:description" content="Counting down to January 25, 2027.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>iPhone Duo — Countdown</title>
<style>
  :root{--fg:#f5f7fb;--muted:rgba(235,240,250,.56)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;color:var(--fg);
    background:radial-gradient(120% 90% at 50% 0%,#1a1f2e 0%,#0b0d14 55%,#06070b 100%);overflow:hidden;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
  /* ambient light: large, soft, low-saturation pools that sit behind the glass */
  .light{position:fixed;inset:-20%;pointer-events:none;filter:blur(90px);opacity:.75}
  .l1{background:radial-gradient(35% 30% at 30% 35%,rgba(120,150,255,.55),transparent 70%);animation:f1 28s ease-in-out infinite}
  .l2{background:radial-gradient(30% 28% at 70% 60%,rgba(255,140,190,.40),transparent 70%);animation:f2 34s ease-in-out infinite}
  .l3{background:radial-gradient(28% 26% at 55% 40%,rgba(120,230,210,.32),transparent 70%);animation:f3 40s ease-in-out infinite}
  @keyframes f1{50%{transform:translate(6%,4%)}}
  @keyframes f2{50%{transform:translate(-6%,-3%)}}
  @keyframes f3{50%{transform:translate(-4%,5%)}}
  /* key light from above + vignette + film grain */
  .key{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% -5%,rgba(255,255,255,.10),transparent 70%),radial-gradient(130% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .glass{position:relative;border-radius:40px;isolation:isolate;
    background:linear-gradient(160deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.035) 45%,rgba(255,255,255,.06) 100%);
    backdrop-filter:blur(30px) saturate(140%) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(140%) brightness(1.05);
    box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 -1px 0 rgba(0,0,0,.25) inset,0 40px 90px -20px rgba(0,0,0,.6),0 12px 30px -10px rgba(0,0,0,.4)}
  /* gradient rim: bright where the key light hits (top), fading toward the bottom */
  .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(170deg,rgba(255,255,255,.55),rgba(255,255,255,.10) 35%,rgba(255,255,255,.04) 65%,rgba(255,255,255,.18));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  /* soft specular sheen that follows the pointer */
  .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
    background:radial-gradient(70% 50% at var(--mx,50%) var(--my,0%),rgba(255,255,255,.10),transparent 70%)}
  .card{padding:clamp(32px,5vw,60px) clamp(22px,5vw,64px);text-align:center;width:min(92vw,960px)}
  .eyebrow{font-size:12px;font-weight:500;letter-spacing:.38em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(36px,6vw,64px);font-weight:650;letter-spacing:-.035em;margin:12px 0 6px;
    background:linear-gradient(180deg,#ffffff 30%,rgba(220,228,245,.7));-webkit-background-clip:text;background-clip:text;color:transparent}
  .date{color:var(--muted);font-size:15px;letter-spacing:.01em}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,18px);margin:clamp(28px,4vw,44px) 0 30px}
  .unit{padding:clamp(18px,3vw,30px) 6px;border-radius:26px;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .num{font-size:clamp(40px,8vw,88px);font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1;display:inline-block;
    text-shadow:0 0 30px rgba(170,190,255,.25)}
  .num.tick{animation:pop .5s cubic-bezier(.22,1,.36,1)}
  @keyframes pop{0%{opacity:.35;transform:translateY(-4px)}100%{opacity:1;transform:none}}
  .lbl{margin-top:12px;font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
  .bar{height:6px;border-radius:99px;overflow:hidden;padding:0;background:rgba(255,255,255,.07);backdrop-filter:none;box-shadow:none}
  .bar::after{display:none}
  .fill{height:100%;border-radius:99px;width:0;background:linear-gradient(90deg,#8ea6ff,#9fe8dc,#f3a6c8);
    box-shadow:0 0 14px rgba(159,232,220,.45);transition:width 1s linear}
  .meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted)}
  .done h1{font-size:clamp(40px,8vw,84px)}
  @media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (prefers-reduced-motion:reduce){.light,.num.tick{animation:none}}

  html,body{min-height:100dvh}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent;user-select:none}
  @media (max-width:560px){
    .card{border-radius:32px;padding:30px 18px 26px}
    .unit{border-radius:22px;padding:20px 6px}
    .num{font-size:clamp(46px,15vw,64px)}
    .grid{gap:12px;margin:26px 0 24px}
    .meta{font-size:11px}
    .light{filter:blur(60px)}
  }
</style>
</head>
<body>
  <div class="light l1"></div><div class="light l2"></div><div class="light l3"></div><div class="key"></div><div class="grain"></div>
  <main class="glass card" id="card">
    <div class="eyebrow">Incoming</div>
    <h1 id="title">iPhone Duo</h1>
    <div class="date" id="date"></div>
    <div class="grid">
      <div class="glass unit"><span class="num" id="d">--</span><div class="lbl">Days</div></div>
      <div class="glass unit"><span class="num" id="h">--</span><div class="lbl">Hours</div></div>
      <div class="glass unit"><span class="num" id="m">--</span><div class="lbl">Minutes</div></div>
      <div class="glass unit"><span class="num" id="s">--</span><div class="lbl">Seconds</div></div>
    </div>
    <div class="glass bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span>Waiting since Oct 19</span><span id="pct"></span></div>
  </main>
<script>
  // Edit these two lines to retarget.
  const TARGET = new Date(2027, 0, 25, 0, 0, 0);   // Jan 25, 2027, local midnight
  const START  = new Date(2026, 9, 19, 0, 0, 0);   // when the wait began
  const $ = id => document.getElementById(id);
  $('date').textContent = TARGET.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const pad = n => String(n).padStart(2,'0');
  const last = {};
  function set(id, v){ if(last[id]===v) return; last[id]=v; const el=$(id); el.textContent=v; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); }
  function tick(){
    const now = new Date(), ms = TARGET - now;
    if (ms <= 0){ document.getElementById('card').classList.add('done'); $('title').textContent='It\u2019s Duo day.';
      ['d','h','m','s'].forEach(k=>set(k,'00')); $('fill').style.width='100%'; $('pct').textContent='100%'; return; }
    const t = Math.floor(ms/1000);
    set('d', String(Math.floor(t/86400))); set('h', pad(Math.floor(t%86400/3600)));
    set('m', pad(Math.floor(t%3600/60))); set('s', pad(t%60));
    const p = Math.min(100, Math.max(0, (now-START)/(TARGET-START)*100));
    $('fill').style.width = p.toFixed(3)+'%'; $('pct').textContent = p.toFixed(1)+'% of the wait done';
  }
  tick(); setInterval(tick, 1000);
  addEventListener('pointermove', e => { const c=$('card').getBoundingClientRect();
    $('card').style.setProperty('--mx', ((e.clientX-c.left)/c.width*100)+'%');
    $('card').style.setProperty('--my', ((e.clientY-c.top)/c.height*100)+'%'); });
</script>
</body>
</html>
